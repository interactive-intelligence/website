name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # weekly run keeps the image cache from being evicted after 7 idle days
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # must come after npm ci, which wipes node_modules.
      # The key is unique per run so the cache is saved after every build;
      # restore-keys picks up the most recent one. Astro's image cache is
      # content-addressed, so it invalidates itself when images change.
      - uses: actions/cache@v5
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
