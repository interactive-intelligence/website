name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild just after midnight Pacific (08:15 UTC is 1:15am PDT / 12:15am PST).
  # Date-dependent content (closed links, "Now" badges, upcoming vs past talks) is
  # computed at build time, and regular runs keep the image cache from being evicted.
  schedule:
    - cron: '15 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      hash: ${{ steps.compare.outputs.hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # must come after npm ci, which wipes node_modules.
      # The key is unique per run so the cache is saved after every build;
      # restore-keys picks up the most recent one. Astro's image cache is
      # content-addressed, so it invalidates itself when images change.
      - uses: actions/cache@v5
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-
      - run: npm run build
      # Every deploy resets the dates GitHub Pages sends with each file, so browsers download
      # all of it again. Daily runs skip the deploy when the site is the same as what's live,
      # by comparing a hash of dist with the one saved after the last deploy.
      - uses: actions/cache/restore@v5
        with:
          path: .last-deploy
          key: last-deploy-${{ github.run_id }}
          restore-keys: last-deploy-
      - id: compare
        run: |
          hash=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(cat .last-deploy 2>/dev/null)" = "$hash" ]; then
            echo "Unchanged since the last deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - run: echo "${{ needs.build.outputs.hash }}" > .last-deploy
      - uses: actions/cache/save@v5
        with:
          path: .last-deploy
          key: last-deploy-${{ github.run_id }}
