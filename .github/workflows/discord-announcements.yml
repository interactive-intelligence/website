name: Discord announcements

# Reads new messages in the Discord announcements channel and posts the ones that
# belong on the site. See scripts/discord-announcements.js and the README.
on:
  workflow_dispatch:
  # Every 15 minutes, off the top of the hour when GitHub's scheduler is busiest.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write # push announcements to main
  actions: write # start the deploy workflow

concurrency:
  group: discord-announcements
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_IDS: ${{ vars.DISCORD_CHANNEL_IDS }}
      DISCORD_PING_CHANNEL_IDS: ${{ vars.DISCORD_PING_CHANNEL_IDS }}
      DISCORD_ROLE_IDS: ${{ vars.DISCORD_ROLE_IDS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Most runs find nothing new, so skip the install and build unless there's work.
      - id: check
        run: node scripts/discord-announcements.js check
      - if: steps.check.outputs.pending == 'true'
        run: npm ci
      # Reuse the deploy workflow's image cache so the validation build stays fast.
      - if: steps.check.outputs.pending == 'true'
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-
      - if: steps.check.outputs.pending == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/discord-announcements.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
